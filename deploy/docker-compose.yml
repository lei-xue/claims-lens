# Public static hosting for Claims Lens on the shared edge tunnel (see /opt/edge).
# Site files: /opt/claims-lens/site (built by update.sh). Tunnel hostname → http://claims:80
name: claims-lens

services:
  web:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - /opt/claims-lens/site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
    networks:
      edge:
        aliases: [claims]
    logging:
      driver: json-file
      options: { max-size: 5m, max-file: '2' }

networks:
  edge:
    external: true
